# =============================================================================
# Traefik v3 — Configuracion Estatica
# =============================================================================
# Referencia: https://doc.traefik.io/traefik/v3.1/
# =============================================================================

# ─── API & Dashboard ────────────────────────────────────────────────────────
api:
  dashboard: true
  insecure: true  # Solo para desarrollo — deshabilitar en produccion

# ─── Entry Points ────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

# ─── Providers ───────────────────────────────────────────────────────────────
providers:
  docker:
    exposedByDefault: false
    network: backend
    watch: true
  file:
    directory: /etc/traefik/dynamic/
    watch: true

# ─── Healthcheck (ping) ────────────────────────────────────────────────────────
# Servido por el entryPoint interno "traefik" (puerto 8080, expuesto via api.insecure).
# Requerido por el healthcheck de docker-compose.yml: ["CMD","traefik","healthcheck"].
ping:
  entryPoint: traefik

# ─── Metricas (Prometheus) ─────────────────────────────────────────────────────
# Expuestas en /metrics del mismo entryPoint interno "traefik" (puerto 8080).
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

# ─── Logging ─────────────────────────────────────────────────────────────────
log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"
    retryAttempts: true
    minDuration: "100ms"
