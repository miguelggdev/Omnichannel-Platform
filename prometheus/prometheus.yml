# =============================================================================
# Prometheus — Configuracion de Scraping
# =============================================================================
# Referencia: https://prometheus.io/docs/prometheus/latest/configuration/configuration/
# Todos los targets se resuelven por DNS interno de la red "backend" de
# docker-compose.yml (Sprint 2), ampliada en Sprint 8 con Jaeger y
# redis-exporter.
# =============================================================================

# ─── Global ────────────────────────────────────────────────────────────────
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: omnichannel
    environment: development  # En produccion se cambia a "production"

# ─── Reglas ────────────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/alerts.yml

# ─── Scrape Configs ────────────────────────────────────────────────────────
scrape_configs:
  # Prometheus se scrapea a si mismo.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Metricas del API Gateway (Traefik v3), habilitadas en traefik/traefik.yml
  # (bloque metrics.prometheus), servidas por el entryPoint interno "traefik".
  - job_name: traefik
    static_configs:
      - targets:
          - traefik:8080
    metrics_path: /metrics

  # ─── Backend FastAPI ────────────────────────────────────────────────────
  # `dns_sd_configs` y no `static_configs`: el servicio `api` corre con
  # `replicas: 2`, y el DNS embebido de Docker devuelve **las dos** IPs para el
  # nombre `api`. Con un target estatico "api:8000", Prometheus se queda con la
  # primera IP que resuelva y deja de ver la otra replica entera — sus
  # contadores no aparecerian en ningun dashboard. Con descubrimiento por DNS
  # hay un target por replica, cada uno con su serie.
  #
  # La ruta es /internal/metrics, no /metrics: el endpoint vive bajo el prefijo
  # interno para que no cuelgue del router publico (ver app/api/internal/metrics.py).
  - job_name: api
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 8000
        refresh_interval: 30s
    metrics_path: /internal/metrics

  # ─── Workers de Celery ──────────────────────────────────────────────────
  # Cada worker levanta su propio exporter en 9100 (`worker_init` en
  # app/tasks/observability.py). Sin estos targets, todo lo que se mide dentro
  # de una tarea —tokens, handoffs, mensajes, RAG— no lo recoge nadie: la API
  # no ve nada de lo que pasa en los workers.
  - job_name: celery-workers
    dns_sd_configs:
      - names:
          - celery-webhooks
          - celery-ai
          - celery-documents
          - celery-notifications
          - celery-bulk
          - celery-lead-enrichment
          - celery-beat
        type: A
        port: 9100
        refresh_interval: 30s

  # ─── Redis y profundidad de las colas ───────────────────────────────────
  # `redis_key_size{key="ai_inference"}` es el largo de esa lista en Redis, o
  # sea la cola de Celery pendiente. Ver REDIS_EXPORTER_CHECK_KEYS en
  # docker-compose.yml.
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  # ─── Jaeger ─────────────────────────────────────────────────────────────
  # Sus propias metricas: spans recibidos, rechazados y descartados. Un pico de
  # `jaeger_collector_spans_dropped_total` avisa de que la traza que se esta
  # buscando puede no estar completa.
  - job_name: jaeger
    static_configs:
      - targets:
          - jaeger:14269

# ─── Nota sobre lo que NO se scrapea ───────────────────────────────────────
# No hay jobs de postgres/supabase/pgbouncer: por ADR-020 el proyecto usa
# Supabase Cloud, no contenedores propios de base de datos, y Supabase Cloud no
# se scrapea desde este Prometheus local. Por eso la alerta de conexiones de la
# base que propone el spec (§5, `pg_stat_activity_count`) no esta en alerts.yml:
# no hay exporter que produzca esa metrica.
#
# Tampoco hay `celery-exporter`: las metricas de tareas (duracion, estado) las
# publica la propia aplicacion por señales de Celery, con las mismas etiquetas
# que el resto del catalogo y sin un servicio mas que mantener.
