[project]
name = "omnichannel-platform"
version = "0.1.0"
description = "Plataforma SaaS Omnicanal Multi-Tenant de IA Conversacional"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print en producción)
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ASYNC",# flake8-async
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "S101",   # assert en tests es válido
    "S104",   # binding to all interfaces (Docker)
    "RET504", # assignment before return (readability)
    "UP017",  # datetime-timezone-utc — usamos timezone.utc para compat Python 3.10+
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "T20"]  # assert, hardcoded passwords, print ok en tests
"scripts/**/*.py" = ["T20"]                                  # print ok en scripts
"app/models/**/*.py" = ["F821"]                              # forward refs en Mapped["Model"] (SQLAlchemy)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: tests que requieren PostgreSQL activo (usar --run-db)",
    "slow: tests lentos que pueden omitirse con -m 'not slow'",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
disallow_untyped_defs = true
no_implicit_optional = true

# Modulos que todavia no existen y se importan de forma perezosa. Quitar de esta
# lista en cuanto entren en main. app.services.messaging.* salio en Sprint 4
# (PR #8); app.services.{document_pipeline,chunker,embedding,ocr,rag} en
# Sprint 5 (Dev A); app.agents.graph en Sprint 6 (PR #14), que importan
# app.tasks.ai_processor y app.agents.nodes.*.
# app.services.contact_unifier y app.models.agent_action_log salieron en
# Sprint 7 (Dev A) y se sacan de aca.
[[tool.mypy.overrides]]
module = [
    "app.tasks.ai_processor",
    "app.agents.nodes.*",
]
ignore_missing_imports = true

# Celery no publica stubs: @shared_task es Any y mypy marca la tarea como untyped.
[[tool.mypy.overrides]]
module = "app.tasks.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kombu.*"
ignore_missing_imports = true

# Re-ranking del RAG (Sprint 12): ninguno de los dos publica py.typed.
[[tool.mypy.overrides]]
module = "onnxruntime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tokenizers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

# langchain-openai se importa de forma perezosa en app/agents/nodes/_llm.py y no
# publica stubs.
[[tool.mypy.overrides]]
module = ["langchain_openai", "langchain_openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "loguru.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true

# google-api-python-client / google-auth no publican stubs.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google.oauth2.*"]
ignore_missing_imports = true

# Sin stubs: pytesseract y pymupdf no los publican; openpyxl los publica en un
# paquete aparte (types-openpyxl) que no vale la pena sumar solo por esto.
[[tool.mypy.overrides]]
module = ["pytesseract.*", "pymupdf.*", "openpyxl.*"]
ignore_missing_imports = true

# pymupdf trae su propio py.typed, pero deja varias firmas (Matrix, Document,
# open) sin anotar del todo. La opcion tiene que ir en el modulo que LLAMA a
# pymupdf, no en pymupdf mismo: un override de mypy se aplica al codigo del
# modulo listado, no a quien lo importa (mismo patron que app.tasks.* con
# @shared_task de Celery, arriba).
[[tool.mypy.overrides]]
module = ["app.services.ocr", "app.services.document_pipeline"]
disallow_untyped_calls = false

# google-auth publica `py.typed` pero deja `Credentials.from_service_account_info`
# sin anotar del todo; mismo caso que pymupdf arriba.
[[tool.mypy.overrides]]
module = "app.services.calendar"
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "app.models.*"
disable_error_code = ["name-defined"]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B105"]  # B101: assert ok, B105: false positives on error code constants

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
allowed_prefixes = ["feat", "fix", "refactor", "test", "docs", "infra", "chore"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__init__.py",
    "app/main.py",
    "*/migrations/*",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]
