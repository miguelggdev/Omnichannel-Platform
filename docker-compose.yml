# =============================================================================
# Docker Compose — Plataforma SaaS Omnicanal Multi-Tenant
# =============================================================================
# Uso: docker-compose up -d
# Dashboard Traefik: http://localhost:8080
# API: https://api.localhost
# Grafana: http://localhost:3000
# =============================================================================
# ADR-020: PostgreSQL, Auth, Storage y Realtime provistos por Supabase Cloud.
#           DATABASE_URL apunta al Transaction Pooler (Supavisor, puerto 6543).
#           No se levantan contenedores locales para estos componentes.
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. TRAEFIK — API Gateway & Reverse Proxy
  # ─────────────────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Dashboard con `api.insecure: true` (sin autenticacion): solo localhost del
      # host. El healthcheck y el scrape de Prometheus usan la red interna.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic/:/etc/traefik/dynamic/:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. API — FastAPI (2 replicas con load balancing via Traefik)
  # ─────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-30}
      - JWT_REFRESH_EXPIRATION_DAYS=${JWT_REFRESH_EXPIRATION_DAYS:-7}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - OPENAI_FALLBACK_MODEL=${OPENAI_FALLBACK_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - YCLOUD_API_KEY=${YCLOUD_API_KEY}
      - YCLOUD_WEBHOOK_SECRET=${YCLOUD_WEBHOOK_SECRET}
      - YCLOUD_BASE_URL=${YCLOUD_BASE_URL:-https://api.ycloud.com/v2}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-documents}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-omnichannel-api}
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
      - DEFAULT_CLIENT_ID=${DEFAULT_CLIENT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - EMAIL_INBOUND_WEBHOOK_SECRET=${EMAIL_INBOUND_WEBHOOK_SECRET}
      # Webchat (WebSocket): vacio = desactivado.
      - WEBCHAT_CHANNEL_TOKEN=${WEBCHAT_CHANNEL_TOKEN}
      - WEBCHAT_ALLOWED_ORIGINS=${WEBCHAT_ALLOWED_ORIGINS:-[]}
      - WEBCHAT_SESSION_TTL_DAYS=${WEBCHAT_SESSION_TTL_DAYS:-30}
      - WEBCHAT_MAX_MESSAGES_PER_MINUTE=${WEBCHAT_MAX_MESSAGES_PER_MINUTE:-20}
      - WEBCHAT_MAX_MESSAGE_CHARS=${WEBCHAT_MAX_MESSAGE_CHARS:-4000}
      - WEBCHAT_MAX_FRAME_BYTES=${WEBCHAT_MAX_FRAME_BYTES:-16384}
      - WEBCHAT_MAX_CONNECTIONS_PER_VISITOR=${WEBCHAT_MAX_CONNECTIONS_PER_VISITOR:-5}
      - WEBCHAT_HELLO_TIMEOUT_SECONDS=${WEBCHAT_HELLO_TIMEOUT_SECONDS:-10}
      - WEBCHAT_IDLE_TIMEOUT_SECONDS=${WEBCHAT_IDLE_TIMEOUT_SECONDS:-120}
      - WEBCHAT_REPLAY_LIMIT=${WEBCHAT_REPLAY_LIMIT:-50}
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.middlewares=rate-limit@file,security-headers@file,compress@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/internal/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/internal/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. REDIS — Cache + Broker Celery + Dedup webhooks
  #    DB 0: Celery broker | DB 1: Celery results | DB 2: App cache
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      # Solo localhost del host: la API y los workers llegan por la red
      # `backend`. Con requirepass, pero un Redis abierto a internet es un
      # blanco de fuerza bruta y de explotacion de CVEs del propio Redis.
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. CELERY-WEBHOOKS — Worker para procesamiento de webhooks entrantes
  #    Concurrencia: 4 (alta frecuencia, bajo CPU)
  # ─────────────────────────────────────────────────────────────────────────────
  celery-webhooks:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_config worker
      -Q webhooks
      -c ${CELERY_WEBHOOK_CONCURRENCY:-4}
      --loglevel=${LOG_LEVEL:-info}
      -n webhooks@%h
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - YCLOUD_API_KEY=${YCLOUD_API_KEY}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - DEFAULT_CLIENT_ID=${DEFAULT_CLIENT_ID}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=omnichannel-worker-webhooks
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_config inspect ping -d webhooks@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. CELERY-AI — Worker para inferencia LLM y agentes LangGraph
  #    Concurrencia: 2 (alto CPU/memoria, llamadas API lentas)
  # ─────────────────────────────────────────────────────────────────────────────
  celery-ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_config worker
      -Q ai_inference
      -c ${CELERY_AI_CONCURRENCY:-2}
      --loglevel=${LOG_LEVEL:-info}
      -n ai@%h
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - OPENAI_FALLBACK_MODEL=${OPENAI_FALLBACK_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Agente de agendamiento (Sprint 7): Google Calendar.
      - GOOGLE_CALENDAR_CREDENTIALS_JSON=${GOOGLE_CALENDAR_CREDENTIALS_JSON}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - DEFAULT_CLIENT_ID=${DEFAULT_CLIENT_ID}
      - YCLOUD_API_KEY=${YCLOUD_API_KEY}
      - YCLOUD_PHONE_NUMBER_ID=${YCLOUD_PHONE_NUMBER_ID}
      - YCLOUD_BASE_URL=${YCLOUD_BASE_URL:-https://api.ycloud.com/v2}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v19.0}
      - TELEGRAM_CHANNEL_BOT_TOKEN=${TELEGRAM_CHANNEL_BOT_TOKEN}
      - TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Soporte}
      - OTEL_SERVICE_NAME=omnichannel-worker-ai
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_config inspect ping -d ai@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. CELERY-DOCUMENTS — Worker para ingestion de documentos y OCR
  #    Concurrencia: 2 (I/O pesado, requiere tesseract-ocr)
  # ─────────────────────────────────────────────────────────────────────────────
  celery-documents:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_config worker
      -Q documents
      -c ${CELERY_DOCUMENTS_CONCURRENCY:-2}
      --loglevel=${LOG_LEVEL:-info}
      -n documents@%h
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # `document_pipeline` descarga el archivo subido desde Supabase Storage.
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-documents}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=omnichannel-worker-documents
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_config inspect ping -d documents@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. CELERY-NOTIFICATIONS — Worker para envio de notificaciones
  #    Concurrencia: 2 (I/O bound, llamadas a APIs externas)
  # ─────────────────────────────────────────────────────────────────────────────
  celery-notifications:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_config worker
      -Q notifications
      -c ${CELERY_NOTIFICATIONS_CONCURRENCY:-2}
      --loglevel=${LOG_LEVEL:-info}
      -n notifications@%h
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - YCLOUD_API_KEY=${YCLOUD_API_KEY}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - DEFAULT_CLIENT_ID=${DEFAULT_CLIENT_ID}
      - YCLOUD_PHONE_NUMBER_ID=${YCLOUD_PHONE_NUMBER_ID}
      - YCLOUD_BASE_URL=${YCLOUD_BASE_URL:-https://api.ycloud.com/v2}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v19.0}
      - TELEGRAM_CHANNEL_BOT_TOKEN=${TELEGRAM_CHANNEL_BOT_TOKEN}
      - TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Soporte}
      - OTEL_SERVICE_NAME=omnichannel-worker-notifications
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_config inspect ping -d notifications@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. CELERY-BULK — Worker para operaciones masivas (broadcast, imports)
  #    Concurrencia: 1 (operaciones secuenciales pesadas)
  # ─────────────────────────────────────────────────────────────────────────────
  celery-bulk:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_config worker
      -Q bulk
      -c ${CELERY_BULK_CONCURRENCY:-1}
      --loglevel=${LOG_LEVEL:-info}
      -n bulk@%h
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - DEFAULT_CLIENT_ID=${DEFAULT_CLIENT_ID}
      - OTEL_SERVICE_NAME=omnichannel-worker-bulk
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_config inspect ping -d bulk@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # 9. CELERY-LEAD-ENRICHMENT — Worker para enriquecimiento asincrono de leads
  #    Concurrencia: 2 (llamadas a APIs externas: Clearbit, Hunter, etc.)
  #    ADR-022: Pipeline de enriquecimiento asincrono
  # ─────────────────────────────────────────────────────────────────────────────
  celery-lead-enrichment:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_config worker
      -Q lead_enrichment
      -c ${CELERY_ENRICHMENT_CONCURRENCY:-2}
      --loglevel=${LOG_LEVEL:-info}
      -n lead-enrichment@%h
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLEARBIT_API_KEY=${CLEARBIT_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_PHONE_NUMBER=${VAPI_PHONE_NUMBER}
      - BLAND_AI_API_KEY=${BLAND_AI_API_KEY}
      - BLAND_AI_PHONE_NUMBER=${BLAND_AI_PHONE_NUMBER}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=omnichannel-worker-lead-enrichment
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_config inspect ping -d lead-enrichment@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # 9b. CELERY-MEDIA — Worker para transcripcion de audio (Whisper)
  #     Concurrencia: 2 (descarga + llamada a la API de OpenAI, hasta 100 s por tarea)
  #     ADR-060: cola propia para que una nota de voz larga no bloquee las respuestas
  #     del LLM (`ai_inference` corre con concurrency 2).
  #     Necesita las credenciales de los canales: si no se puede transcribir, la tarea
  #     escala a un humano y eso ENVIA un mensaje al contacto.
  # ─────────────────────────────────────────────────────────────────────────────
  celery-media:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_config worker
      -Q media
      -c ${CELERY_MEDIA_CONCURRENCY:-2}
      --loglevel=${LOG_LEVEL:-info}
      -n media@%h
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-}
      - WHISPER_MAX_AUDIO_BYTES=${WHISPER_MAX_AUDIO_BYTES:-20971520}
      - WHISPER_COST_PER_MINUTE_USD=${WHISPER_COST_PER_MINUTE_USD:-0.006}
      - WHISPER_TIMEOUT_SECONDS=${WHISPER_TIMEOUT_SECONDS:-60}
      - MEDIA_DOWNLOAD_TIMEOUT_SECONDS=${MEDIA_DOWNLOAD_TIMEOUT_SECONDS:-30}
      - DEFAULT_CLIENT_ID=${DEFAULT_CLIENT_ID}
      - YCLOUD_API_KEY=${YCLOUD_API_KEY}
      - YCLOUD_PHONE_NUMBER_ID=${YCLOUD_PHONE_NUMBER_ID}
      - YCLOUD_BASE_URL=${YCLOUD_BASE_URL:-https://api.ycloud.com/v2}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v19.0}
      - TELEGRAM_CHANNEL_BOT_TOKEN=${TELEGRAM_CHANNEL_BOT_TOKEN}
      - TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Soporte}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=omnichannel-worker-media
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_config inspect ping -d media@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────────
  # 10. CELERY-BEAT — Scheduler para tareas periodicas
  # ─────────────────────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_config beat
      --loglevel=${LOG_LEVEL:-info}
      --schedule=/tmp/celerybeat-schedule
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_SERVICE_NAME=omnichannel-beat
      - OTEL_TRACES_SAMPLER_RATIO=${OTEL_TRACES_SAMPLER_RATIO:-1.0}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    tmpfs:
      # Metricas multiproceso de prometheus_client: en RAM y vacio en
      # cada arranque, que es lo que exige el modo multiproceso (si
      # arrastra ficheros de procesos muertos, los suma al scrape).
      - /tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  # ─────────────────────────────────────────────────────────────────────────────
  # 11. JAEGER — Collector OTLP y UI de trazas
  #     Recibe los spans de la API y de los workers por gRPC (4317). El
  #     almacenamiento de all-in-one es en memoria: sirve para operar y depurar,
  #     no para retencion historica. Para eso, cambiar a Tempo o a un collector
  #     con backend persistente.
  # ─────────────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.54
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Techo de trazas en memoria: sin el, un pico de trafico se come la RAM
      # del host. all-in-one descarta las mas viejas al llegar al limite.
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "50000"
    ports:
      # Solo la UI sale del contenedor, y solo a localhost del host: sin el
      # "127.0.0.1:" Docker publica en 0.0.0.0 y Jaeger (sin autenticacion
      # propia) quedaria abierto a cualquiera que llegue a la IP del servidor.
      # Los puertos OTLP (4317/4318) se quedan dentro de la red `backend`.
      - "127.0.0.1:16686:16686"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # 12. REDIS-EXPORTER — Metricas de Redis y profundidad de las colas de Celery
  #     `check-keys` publica el largo de cada lista como `redis_key_size`, que es
  #     exactamente la profundidad de cada cola. La alternativa —medirla desde la
  #     aplicacion— obligaria a un LLEN sincrono dentro del endpoint async de
  #     metricas, y a un Gauge compartido entre los cuatro procesos de la API.
  # ─────────────────────────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_CHECK_KEYS: >-
        0=webhooks,0=ai_inference,0=documents,0=notifications,0=bulk,0=lead_enrichment,0=media
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────────
  # 13. PROMETHEUS — Recoleccion de metricas
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      # Solo localhost del host: Prometheus no autentica y sus series llevan
      # `client_id` como label (actividad y costos por tenant).
      - "127.0.0.1:9090:9090"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # 14. GRAFANA — Dashboards de observabilidad
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"
    volumes:
      - grafana_data:/var/lib/grafana
      # Provisioning declarativo (datasource Prometheus + provider de dashboards).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Los JSON de dashboards viven en options.path del provider, no en provisioning/.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Solo localhost del host; para verlo desde fuera, tunel SSH o Traefik.
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ═══════════════════════════════════════════════════════════════════════════════
# REDES
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════════
# VOLUMENES PERSISTENTES
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
